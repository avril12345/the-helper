$('t-jobs').innerHTML='<h2>Ranked jobs</h2>'+D.jobs.map(j=>`<div class="card"><div class="t"><span class="rank">#${j.rank}</span>${esc(j.title)}, ${esc(j.co)}${j.junior?' <span class="jr">Junior (&lt;2 yrs)</span>':''}</div><div class="m">${esc(j.sector)} · ${esc(j.loc)}<br>${esc(j.pay)} · Posted: ${esc(j.posted)}</div></div>`).join('')
 +'<p class="warn">Roles 1–3 are junior (under 2 years asked). Prosper Health does not list a salary. Only D. E. Shaw (Oct 27) is confirmed posted in the last 3 days. All pay is the employer\'s posted range. Every link returned a live page on Oct 29.</p><h2>Role details</h2>'
 +D.jobs.map(j=>`<details ${j.rank<=2?'open':''}><summary>${j.rank}. ${esc(j.title)} at ${esc(j.co)}${j.junior?' <span class="jr">Junior (&lt;2 yrs)</span>':''}</summary><div class="body">
 <div class="kv"><b>Location:</b> ${esc(j.loc)}</div><div class="kv"><b>Pay:</b> ${esc(j.pay)}</div><div class="kv"><b>Posted:</b> ${esc(j.posted)}</div><div class="kv"><b>Apply:</b> ${link(j.url)}</div>
 <h3>Qualifications she matches</h3>${list(j.why)}<h3>Application questions and answer outlines</h3>${list(j.qs)}<h3>Referral routes</h3>${list(j.refs)}</div></details>`).join('');
// People
$('t-people').innerHTML='<h2>Network</h2><p>Tap a name for the contact link, the hook and the message outline.</p>'+D.people.map(p=>`<details><summary>${esc(p.name)}<br><span class="m" style="font-weight:400;color:#6B5B8A">${esc(p.role)}</span></summary><div class="body">
 <div class="kv"><b>Contact:</b> ${link(p.link)}</div><div class="kv"><b>Why:</b> ${esc(p.why)}</div><div class="kv"><b>Hook:</b> ${esc(p.hook)}</div><div class="kv"><b>Message:</b> ${esc(p.msg)}</div><div class="kv"><b>Source:</b> ${link(p.source)}</div></div></details>`).join('');
// History
$('t-past').innerHTML=`<h2>History</h2><div class="card"><div class="t">Your twice-weekly shortlist: 10 roles + 10 people (Oct 29)</div><div class="m">Oct 29, 2026 · <span class="badge">Draft, not sent</span></div>
<p>Jobs: ${D.jobs.map(j=>esc(j.co.split(' (')[0])).join(', ')}.</p><p>Contacts: ${D.people.map(p=>esc(p.name)).join(', ')}.</p></div><p>Each email sent twice a week is added here.</p>`;
// Meals
let w=localStorage.getItem('week')||'1';
const have=JSON.parse(localStorage.getItem('have')||'{}');let hide=localStorage.getItem('hide')==='1';
function seg(fn){return `<div class="seg">${['1','2'].map(k=>`<button class="${k===w?'on':''}" onclick="${fn}('${k}')">Week ${k}</button>`).join('')}</div>`}
function setW(k){w=k;localStorage.setItem('week',k);renderMeals()}
function tick(key,el){have[key]=el.checked;localStorage.setItem('have',JSON.stringify(have));renderMeals()}
function setHide(el){hide=el.checked;localStorage.setItem('hide',hide?'1':'0');renderMeals()}
function resetW(){Object.keys(have).forEach(k=>{if(k.startsWith(w+'|'))delete have[k]});localStorage.setItem('have',JSON.stringify(have));renderMeals()}
function renderMeals(){const open=new Set([...document.querySelectorAll('#t-meals details[open]')].map(d=>d.dataset.k));const first=!$('t-meals').innerHTML;
 const items=D.shopItems[w];
 const group=(name,pantry)=>`<h3 style="font-size:17px">${name}</h3>`+Object.keys(items).filter(s=>PANTRY.includes(s)===pantry).map(s=>{const its=items[s];const left=its.filter(i=>!have[w+'|'+s+'|'+i[0]]).length;const k='shop'+s;
  const isOpen=first?!pantry:open.has(k);
  return `<details data-k="${k}" ${isOpen?'open':''}><summary>${esc(s)} <span class="m" style="font-weight:400">(${left} of ${its.length} to buy)</span></summary><div class="body">`+its.filter(i=>!(hide&&have[w+'|'+s+'|'+i[0]])).map(i=>{const key=w+'|'+s+'|'+i[0];return `<label class="item ${have[key]?'have':''}"><input type="checkbox" ${have[key]?'checked':''} onchange="tick('${esc(key).replace(/'/g,"\\'")}',this)"><span>${esc(i[0])} <span class="m">· ${esc(i[1])}</span></span></label>`}).join('')+'</div></details>'}).join('');
 $('t-meals').innerHTML=`<h2>Day-by-day plan</h2>${seg('setW')}`+D.plan[w].map(d=>`<div class="card"><div class="t">${esc(d[0])}: ${esc(d[3])}</div><div class="m">Breakfast: ${esc(d[1])}<br>Lunch: ${esc(d[2])}</div></div>`).join('')
 +'<p>Dinner quantities serve 2, plus 1–2 lunch portions for the next day. For one, halve the protein and freeze extra curry, dal and chilli.</p>'
 +`<h2>Dinner recipes, week ${w}</h2>`+D.dinners[w].map(r=>`<details data-k="r${esc(r.title)}" ${open.has('r'+r.title)?'open':''}><summary>${esc(r.title)}</summary><div class="body">${esc(r.detail)}</div></details>`).join('')
 +`<h2>Breakfasts and pickled red onions</h2><div class="card"><div class="t">Chia pudding (5 min, makes 4)</div><div class="m">½ cup chia, 2 cups milk, 1 cup Greek yoghurt, 2 tbsp maple or honey, vanilla. Keeps 4 days.</div></div><div class="card"><div class="t">Eggs on toast</div><div class="m">Wholegrain toast, 2 eggs, turkey bacon, smashed avocado, pickled onions; add spinach or beans for fibre.</div></div><div class="card"><div class="t">Quick pickled red onions (5 min)</div><div class="m">2 sliced red onions; pour over hot ½ cup vinegar, ½ cup water, 1 tbsp sugar, 1 tsp salt. Ready in 30 min, keeps 2 weeks.</div></div>`
 +`<h2>Star Market Fenway shopping list, week ${w}</h2><label class="toggle"><input type="checkbox" ${hide?'checked':''} onchange="setHide(this)"> Hide items I already have</label><p class="m">Tick anything you already have. Ticks are saved on this device. Wednesday top-up: 2 ripe avocados, bread, salad leaves.</p>`
 +group('Fresh and chilled',false)+group('Pantry staples',true)+`<p><button class="btn" onclick="resetW()">Clear week ${w} ticks</button></p>`
 +`<h2>Batch-cooking schedule and food safety</h2><div class="card"><div class="kv"><b>Sunday (about 60 min):</b> Big pot of brown rice (quinoa in week 2), 4 chia jars, pickle onions, chop veg, press tofu, cook dinner with extra for Monday lunch.</div><div class="kv"><b>Wednesday (about 30 min):</b> Fresh rice for Thu–Sat, 4 more chia jars, freeze leftover curry or dal, move the next frozen portion to the fridge.</div><div class="kv"><b>Packing:</b> Pack lunches right after dinner in glass containers; keep avocado, salsa and yoghurt separate.</div><div class="kv"><b>Safe limits:</b> Rice, salmon and chicken: 3 days in the fridge. Curries, dal and chilli: 3–4 days or freeze. Defrost in the fridge, reheat once until steaming.</div></div>`;}
renderMeals();showTab(cur);
</script></body></html>
